# Cloud Run env for analyst-mcp. Rendered by the deploy workflow with envsubst.
GIT_SHA: "${GITHUB_SHA}"
LOG_LEVEL: INFO
BQ_PROJECT: "${GCP_PROJECT_ID}"
BQ_DATASET: nyc_taxi            # removed in phase 3 (datasets come from the app DB per user)
BQ_LOCATION: asia-south1
BQ_MAX_GB: "2"
BQ_MAX_ROWS: "500"
# Phase 3 switches this to Google token verification (queries run as the signed-in user).
# Until then the service is reachable only by sa-api (IAM), and sa-mcp has no BigQuery data access.
AUTH_MODE: none
REQUIRE_APPROVAL: "false"       # the API enforces approval (HITL)
EXPORT_BUCKET: "${EXPORT_BUCKET}"
SIGNER_SERVICE_ACCOUNT: "sa-mcp@${GCP_PROJECT_ID}.iam.gserviceaccount.com"   # signs export URLs as itself
RAG_LOCATION: us-central1
EXAMPLES_BUCKET: "${EXAMPLES_BUCKET}"
DB_HOST: "/cloudsql/${CLOUDSQL_INSTANCE}"
DB_NAME: analyst
DB_USER: analyst
