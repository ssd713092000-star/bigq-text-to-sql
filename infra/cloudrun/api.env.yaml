# Cloud Run env for analyst-api (and the analyst-migrate job). Rendered by the deploy workflow with envsubst.
# Secrets are NOT here: they're mounted with --set-secrets (see .github/workflows/deploy-api.yml).
APP_ENV: prod
LOG_LEVEL: INFO
GIT_SHA: "${GITHUB_SHA}"
WEB_ORIGIN: "${WEB_URL}"
DB_HOST: "/cloudsql/${CLOUDSQL_INSTANCE}"
DB_NAME: analyst
DB_USER: analyst
DB_POOL_SIZE: "5"
MCP_URL: "${MCP_URL}/mcp"
GOOGLE_CLOUD_PROJECT: "${GCP_PROJECT_ID}"
GEMINI_LOCATION: global
CLAUDE_LOCATION: us-east5
RAG_LOCATION: us-central1
EXAMPLES_BUCKET: "${EXAMPLES_BUCKET}"
GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID}"
