# Cloud Run env for analyst-web. Secrets (AUTH_SECRET, AUTH_GOOGLE_SECRET) come from Secret Manager.
GIT_SHA: "${GITHUB_SHA}"
API_URL: "${API_URL}"            # server-side only; the browser talks to web's /api/backend/* proxy
AUTH_URL: "${WEB_URL}"
AUTH_TRUST_HOST: "true"
AUTH_GOOGLE_ID: "${GOOGLE_CLIENT_ID}"
