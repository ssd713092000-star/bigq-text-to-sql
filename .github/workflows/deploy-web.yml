# main -> analyst-web on Cloud Run (prod).
name: deploy-web

on:
  push:
    branches: [main]
    paths:
      - web/**
      - infra/cloudrun/web.env.yaml
      - .github/workflows/deploy-web.yml
      - .github/workflows/_build-push.yml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-web
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npm run lint

  build:
    needs: test
    uses: ./.github/workflows/_build-push.yml
    with:
      service: web
      context: web
      dockerfile: web/Dockerfile
      # browser-side API URL is inlined at build time
      build-args: NEXT_PUBLIC_API_URL=https://analyst-api-${{ vars.GCP_PROJECT_NUMBER }}.${{ vars.GCP_REGION }}.run.app

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: prod
    env:
      REGION: ${{ vars.GCP_REGION }}
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
      WEB_URL: https://analyst-web-${{ vars.GCP_PROJECT_NUMBER }}.${{ vars.GCP_REGION }}.run.app
      API_URL: https://analyst-api-${{ vars.GCP_PROJECT_NUMBER }}.${{ vars.GCP_REGION }}.run.app
    steps:
      - uses: actions/checkout@v7
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Render env file
        run: |
          # shellcheck disable=SC2016  # literal variable list for envsubst
          envsubst '${GITHUB_SHA} ${API_URL} ${WEB_URL} ${GOOGLE_CLIENT_ID}' < infra/cloudrun/web.env.yaml > /tmp/env.yaml
          cat /tmp/env.yaml
      - name: Deploy
        # Phase 2 adds: --set-secrets AUTH_SECRET=auth-secret:latest,AUTH_GOOGLE_SECRET=google-oauth-client-secret:latest
        run: |
          gcloud run deploy analyst-web \
            --image "${{ needs.build.outputs.image }}" \
            --region "$REGION" \
            --service-account "sa-web@${GCP_PROJECT_ID}.iam.gserviceaccount.com" \
            --env-vars-file /tmp/env.yaml \
            --ingress all \
            --allow-unauthenticated \
            --port 8080 \
            --cpu 1 --memory 512Mi --cpu-boost \
            --concurrency 80 --min-instances 0 --max-instances 5 \
            --startup-probe "httpGet.path=/api/healthz,periodSeconds=5,failureThreshold=24,timeoutSeconds=3" \
            --labels "app=analyst,service=web,commit=${GITHUB_SHA:0:12}" \
            --quiet
      - name: Smoke test
        run: |
          curl -fsS --retry 5 --retry-delay 3 "$WEB_URL/api/healthz"; echo
          curl -fsS -o /dev/null -w "GET / -> %{http_code}\n" "$WEB_URL/"
