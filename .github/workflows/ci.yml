# Pull requests: lint, tests and Docker builds (no push) for whatever changed.
name: ci

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions: { contents: read, pull-requests: read }
    outputs:
      python: ${{ steps.f.outputs.python }}
      api: ${{ steps.f.outputs.api }}
      mcp: ${{ steps.f.outputs.mcp }}
      web: ${{ steps.f.outputs.web }}
    steps:
      - uses: actions/checkout@v7
      - id: f
        uses: dorny/paths-filter@v4
        with:
          filters: |
            shared: &shared ['pyproject.toml', 'uv.lock', '.github/workflows/ci.yml']
            python: [*shared, 'api/**', 'mcp_server/**', 'evals/**', 'scripts/**']
            api:    [*shared, 'api/**']
            mcp:    [*shared, 'mcp_server/**']
            web:    ['web/**', '.github/workflows/ci.yml']

  python:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:   # api DB tests build a throwaway database here with the real migrations
        image: pgvector/pgvector:0.8.7-pg17
        env: { POSTGRES_USER: analyst, POSTGRES_PASSWORD: test, POSTGRES_DB: analyst }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U analyst" --health-interval 5s --health-timeout 3s --health-retries 20
    env: { DB_HOST: localhost, DB_PORT: "5432", DB_USER: analyst, DB_PASSWORD: test, REQUIRE_DB_TESTS: "1" }
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with: { enable-cache: true }
      - run: uv sync --frozen --all-packages
      - run: uv run ruff check api mcp_server
      - run: uv run pytest -q

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  docker:
    needs: changes
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { service: api, context: ., dockerfile: api/Dockerfile }
          - { service: mcp, context: ., dockerfile: mcp_server/Dockerfile }
          - { service: web, context: web, dockerfile: web/Dockerfile }
    steps:
      - uses: actions/checkout@v7
        if: needs.changes.outputs[matrix.service] == 'true'
      - uses: docker/setup-buildx-action@v4
        if: needs.changes.outputs[matrix.service] == 'true'
      - uses: docker/build-push-action@v7
        if: needs.changes.outputs[matrix.service] == 'true'
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          cache-from: type=gha,scope=${{ matrix.service }}
