# Reusable: build one service image and push it to Artifact Registry, tagged with the commit SHA.
name: _build-push

on:
  workflow_call:
    inputs:
      service: { description: "api | mcp | web", required: true, type: string }
      context: { required: true, type: string }
      dockerfile: { required: true, type: string }
      build-args: { required: false, type: string, default: "" }
    outputs:
      image:
        description: Pushed image reference (registry/path:sha)
        value: ${{ jobs.build.outputs.image }}

permissions:
  contents: read
  id-token: write   # GitHub OIDC token -> Workload Identity Federation (no service-account keys)

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v7

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Image name
        id: meta
        run: |
          registry="${{ vars.GCP_REGION }}-docker.pkg.dev"
          echo "registry=$registry" >> "$GITHUB_OUTPUT"
          echo "image=$registry/${{ vars.GCP_PROJECT_ID }}/analyst/${{ inputs.service }}:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - run: gcloud auth configure-docker "${{ steps.meta.outputs.registry }}" --quiet

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.image }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            ${{ inputs.build-args }}
          cache-from: type=gha,scope=${{ inputs.service }}
          cache-to: type=gha,mode=max,scope=${{ inputs.service }}
