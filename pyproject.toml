[project]
name = "data-analyst-ai"
version = "0.1.0"
description = "Text-to-SQL analyst: workspace root (api, mcp_server, evals)"
readme = "README.md"
authors = [
    { name = "swayamdas1309", email = "142828299+swayamdas1309@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "ruff>=0.17.4",
]
# data_loader.ipynb / agent_test.ipynb
notebooks = [
    "fastparquet>=2026.9.0",
    "ipykernel>=7.4.0",
    "polars>=2.1.0",
    "pyarrow>=26.0.1",
    "python-dotenv>=1.2.4",
]

[tool.uv]
package = false
default-groups = ["dev", "notebooks"]

[tool.uv.workspace]
members = ["api", "mcp_server", "evals"]

[tool.ruff]
line-length = 120
target-version = "py313"
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["BLE001"]  # tools deliberately catch everything and return {"ok": false, ...}

[tool.ruff.lint.per-file-ignores]
"api/migrations/versions/*" = ["E501", "W291"]  # autogenerated

[tool.ruff.lint.isort]
known-first-party = ["app", "bq_mcp_server", "rag_store"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["api"]
testpaths = ["api/tests", "mcp_server/tests"]
